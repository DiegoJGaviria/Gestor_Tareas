<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Calidad - Registro de Actividades</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Estilos rápidos para las subtareas dinámicas */
        .subtarea-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .subtarea-row input { margin: 0; }
        .btn-eliminar { background: #f472b6; color: #0f172a; border: none; padding: 0.5rem; cursor: pointer; border-radius: 4px; width: auto; }
        .btn-agregar { background: #34d399; color: #0f172a; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; margin-top: 5px; width: auto; font-weight: bold; }
        fieldset { border: 1px solid #475569; border-radius: 8px; padding: 15px; margin-top: 15px; }
        legend { color: #38bdf8; font-weight: bold; padding: 0 5px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 700px;">
        <h1>Gestor de Tareas</h1>
        
        <div class="progress-section">
            <label>Progreso General del Proceso:</label>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <form id="loginForm">
            <label for="nombreUsuario">Usuario:</label>
            <input type="text" id="nombreUsuario" placeholder="Ingrese su nombre de usuario" required autocomplete="username">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">

            <button type="submit" style="margin-top: 20px; background: #38bdf8;">Ingresar</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
